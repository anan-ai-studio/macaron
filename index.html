<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D リアルマカロン積み上げパズル タイムアタック版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #EDE7F6 0%, #F8BBD0 55%, #FFE4E1 100%);
            touch-action: none;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #sugarCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 花吹雪用キャンバス */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #timerBoard {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #rankingBoard {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            min-width: 150px;
        }
        #rankingBoard h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
            border-bottom: 1px solid #aaa;
            padding-bottom: 5px;
        }
        #rankingBoard ol {
            margin: 0;
            padding-left: 25px;
            font-size: 16px;
        }
        .screen {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 80%;
        }
        #gameOverScreen, #gameClearScreen {
            display: none;
        }
        .clear-banner {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 20px 40px;
            border-radius: 30px 30px 0 0;
            text-align: center;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .clear-banner h1 {
            margin: 0 0 5px 0;
            color: #ff6b81;
            font-size: 28px;
        }
        .clear-banner p {
            margin: 0;
        }
        @media (max-width: 600px) {
            .clear-banner {
                flex-direction: column;
                padding: 20px;
            }
        }
        h1 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .instruction-pc {
            color: #0066cc;
            font-weight: bold;
        }
        .new-record-text {
            color: #e91e63;
            font-weight: bold;
            font-size: 20px;
            display: none;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #ff9a9e; /* マカロンっぽい色 */
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(255, 154, 158, 0.4);
        }
        /* プレイヤー選択画面 */
        #playerScreen {
            display: none;
            max-width: 340px;
            width: 90%;
        }
        #playerScreen h2 {
            margin: 0 0 16px;
            font-size: 20px;
            color: #333;
        }
        #playerList {
            list-style: none;
            margin: 0 0 14px;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        #playerList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #fff0f3;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #444;
            transition: border-color 0.15s, background 0.15s;
        }
        #playerList li:hover { background: #ffe0e6; }
        #playerList li.selected { border-color: #ff9a9e; background: #ffe0e6; }
        #playerList li .del-btn {
            background: none;
            border: none;
            color: #bbb;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            box-shadow: none;
            line-height: 1;
        }
        #playerList li .del-btn:hover { color: #e57373; }
        #newPlayerArea {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        #newPlayerArea input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #ffb3ba;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        #newPlayerArea input:focus { border-color: #ff9a9e; }
        #addPlayerBtn {
            padding: 10px 18px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
        }
        .player-screen-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-guest {
            background-color: #b0bec5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-size: 15px;
            padding: 12px 22px;
        }
        .btn-start-player {
            font-size: 15px;
            padding: 12px 22px;
        }
        /* ゲーム中プレイヤー名表示 */
        #playerBoard {
            position: absolute;
            top: 58px;
            left: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffe0e6;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            pointer-events: none;
        }
    </style>
    <script src="fairy_textures.js"></script>
    <!-- Three.js と Cannon.js の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <canvas id="sugarCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>
    
    <div id="scoreBoard">スコア: <span id="score">0</span></div>
    <div id="playerBoard"></div>
    <div id="timerBoard">残り時間: <span id="timer">60</span>秒</div>

    <div id="rankingBoard">
        <h3>ベストスコア Top5</h3>
        <ol id="rankingList">
            <!-- JSで動的に追加 -->
        </ol>
    </div>

    <!-- 終了後に表示されるボタン -->
    <button id="retryBtnAfterFinish" style="display: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 30; pointer-events: auto; padding: 15px 30px; font-size: 18px; background-color: #ff9a9e; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);">やっぱりもう一度遊ぶ</button>

    <div id="ui">
        <div id="startScreen" class="screen">
            <h1>3D リアルマカロン タイムアタック</h1>
            <p>
                制限時間は1分間！できるだけ高く積もう！<br>
                途中で可愛いお皿の上のマカロンがなくなったらゲームオーバー。<br><br>
                【スマホ】スマホを水平に保って傾ける<br>
                <span class="instruction-pc">【PC】マウスを動かしてお皿を傾ける</span>
            </p>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button id="startBtn">ゲストでプレイ</button>
                <button id="playerSelectBtn" style="background-color: #a78bfa; box-shadow: 0 4px 10px rgba(167,139,250,0.4);">プレイヤー選択</button>
                <button id="endBtnStart" style="background-color: #9e9e9e; box-shadow: 0 4px 10px rgba(158,158,158,0.4);">終了</button>
            </div>
        </div>

        <!-- プレイヤー選択画面 -->
        <div id="playerScreen" class="screen">
            <h2>👤 プレイヤー選択</h2>
            <ul id="playerList"></ul>
            <div id="newPlayerArea">
                <input id="newPlayerInput" type="text" maxlength="12" placeholder="名前を入力（12文字以内）">
                <button id="addPlayerBtn">＋</button>
            </div>
            <div class="player-screen-btns">
                <button id="guestFromPlayerBtn" class="btn-guest">ゲストでプレイ</button>
                <button id="startWithPlayerBtn" class="btn-start-player">このプレイヤーで開始</button>
            </div>
        </div>

        <div id="gameOverScreen" class="screen">
            <h1>ゲームオーバー！</h1>
            <p>マカロンがすべて落ちてしまいました。</p>
            <p style="font-size: 20px; font-weight: bold; color: #333;">記録: <span id="finalScoreOver">0</span> 個</p>
            <button id="retryBtnOver">もう一度遊ぶ</button>
        </div>

        <div id="gameClearScreen" class="clear-banner">
            <div>
                <h1>タイムアップ！</h1>
                <p>1分間耐え抜きました！</p>
            </div>
            <div>
                <p style="font-size: 24px; font-weight: bold; color: #333;">最終スコア: <span id="finalScoreClear">0</span> 個</p>
                <p id="newRecordText" class="new-record-text" style="margin-top: 5px;">🎉 新記録達成！ 🎉</p>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center; align-items: center;">
                <button id="retryBtnClear">もう一度遊ぶ</button>
                <button id="finishBtnClear" style="background-color: #9e9e9e; box-shadow: 0 4px 10px rgba(158, 158, 158, 0.4);">終了</button>
            </div>
        </div>
    </div>

    <script>
        // === HTML要素の取得 ===
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameClearScreen = document.getElementById('gameClearScreen');
        const finalScoreOverEl = document.getElementById('finalScoreOver');
        const finalScoreClearEl = document.getElementById('finalScoreClear');
        const newRecordText = document.getElementById('newRecordText');
        const rankingListEl = document.getElementById('rankingList');
        const startBtn = document.getElementById('startBtn');
        const retryBtnOver = document.getElementById('retryBtnOver');
        const retryBtnClear = document.getElementById('retryBtnClear');
        const finishBtnClear = document.getElementById('finishBtnClear');
        const retryBtnAfterFinish = document.getElementById('retryBtnAfterFinish');
        const container = document.getElementById('canvas-container');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');

        // === グローバル変数 ===
        let scene, camera, renderer;
        let world;
        let blocks = [];
        let fairySprites = [];
        let fairyTime = 0; // 物理ボディと3Dメッシュのペアを保存する配列
        let platformBody, platformMesh;
        
        let score = 0;
        let timeLeft = 60;
        let isGameOver = false;
        let hasStartedStacking = false; // 1個以上積まれたかどうかのフラグ
        let prevConfirmedSettled = 0;
        let awawawCooldown = 0;
        let recentFallCount = 0;
        let recentFallTimer = 0;
        let triggeredMilestones = new Set();
        
        let dropIntervalId = null;
        let timerIntervalId = null;
        let animationFrameId = null;
        let confettiFrameId = null;
        let confettiTimeoutId = null;

        // 台の傾き（角度）を保持する変数
        let targetTiltX = 0; // 前後の傾き（X軸回転）
        let targetTiltZ = 0; // 左右の傾き（Z軸回転）
        const BASE_GRAVITY_Y = -9.8; 
        const MAX_TILT_ANGLE = Math.PI / 8; // 最大22.5度傾く

        // === サウンドシステム（Web Audio API） ===
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const SoundSystem = {
            init: function() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            },
            playTone: function(freq, type, duration, vol, slideToFreq = null) {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if (slideToFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideToFreq, audioCtx.currentTime + duration);
                }
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            playClick: function() {
                this.init();
                this.playTone(880, 'sine', 0.1, 0.3); // ピッ
            },
            playSpawn: function() {
                this.init();
                this.playTone(400, 'sine', 0.15, 0.2, 800); // ポワン（上ずり）
            },
            playCandyDrop: function() {
                this.init();
                this.playTone(1050, 'sine', 0.08, 0.25, 1400); // ティーン♪
                setTimeout(() => this.playTone(1400, 'sine', 0.06, 0.15), 80);
            },
            playCollision: function() {
                this.init();
                // 耳障りでないより柔らかい「コトッ」という音に変更
                this.playTone(250, 'sine', 0.05, 0.05, 150); 
            },
            playGameOver: function() {
                this.init();
                this.playTone(300, 'sawtooth', 0.8, 0.3, 50); // ガックリ下がる音
            },
            playClear: function() {
                this.init();
                // ファンファーレ（タ・タ・ター）
                setTimeout(() => this.playTone(523.25, 'square', 0.2, 0.2), 0);
                setTimeout(() => this.playTone(659.25, 'square', 0.2, 0.2), 150);
                setTimeout(() => this.playTone(783.99, 'square', 0.4, 0.2), 300);
            },
            bgmInterval: null,
            playBGM: function() {
                this.init();
                this.stopBGM();
                // 楽しいポップなアルペジオループ
                const notes = [392, 493.88, 587.33, 493.88]; // G4, B4, D5, B4
                let noteIndex = 0;
                
                this.bgmInterval = setInterval(() => {
                    if (isGameOver) return;
                    this.playTone(notes[noteIndex], 'sine', 0.2, 0.05);
                    noteIndex = (noteIndex + 1) % notes.length;
                }, 300);
            },
            stopBGM: function() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
        };

        // ===== FairyVoice: VOICEVOXで生成したWAVを再生 =====
        // ★キャラクター切り替えはここを1行変えるだけ（変更後はF5でリロード）
        // 選択肢:
        //   'zundamon_amaama'           … ずんだもん あまあま
        //   'zundamon_namidame'         … ずんだもん なみだめ
        //   'sakura_miko_loli'          … 櫻歌ミコ ロリ
        //   'kasukabe_tsumugi'          … 春日部つむぎ ノーマル
        //   'nekotsuka_aru_ukiuki'      … 猫使アル うきうき
        //   'manbetsu_hanamaru_burikko' … 満別花丸 ぶりっ子
        const VOICE_PACK = 'manbetsu_hanamaru_burikko';

        const FairyVoice = {
            _ctx: null,
            _buffers: {},
            _timers: [],
            _ready: false,

            async init(audioCtx) {
                this._ctx = audioCtx;
                const base = 'voice/' + VOICE_PACK + '/';
                const files = {
                    ganbatte:     base + 'ganbatte.wav',
                    sugoi:        base + 'sugoi.wav',
                    meccha_sugoi: base + 'meccha_sugoi.wav',
                    awawa:        'voice/awawa.wav',
                    ganbarttane:  base + 'ganbarttane.wav',
                };
                try {
                    await Promise.all(Object.entries(files).map(async ([key, path]) => {
                        const res = await fetch(path);
                        const buf = await res.arrayBuffer();
                        this._buffers[key] = await this._ctx.decodeAudioData(buf);
                    }));
                    this._ready = true;
                    console.log('[FairyVoice] WAVロード完了');
                } catch(e) {
                    console.warn('[FairyVoice] WAVロード失敗:', e);
                }
            },

            _play(key) {
                if (!this._ready || !this._buffers[key]) return;
                if (this._ctx.state === 'suspended') this._ctx.resume();
                const src = this._ctx.createBufferSource();
                src.buffer = this._buffers[key];
                src.connect(this._ctx.destination);
                src.start();
            },

            _track(t) { this._timers.push(t); return t; },
            _cancelTimers() { this._timers.forEach(clearTimeout); this._timers = []; },

            reset() { this._cancelTimers(); },

            onStart() {
                this._track(setTimeout(() => this._play('ganbatte'), 400));
            },
            onStacked(text, times) {
                const key = text === 'めっちゃすごい！' ? 'meccha_sugoi' : 'sugoi';
                for (let i = 0; i < (times || 1); i++) {
                    this._track(setTimeout(() => this._play(key), i * 1200));
                }
            },
            onDanger() { this._play('awawa'); },
            onGameEnd() {
                setTimeout(() => this._play('ganbarttane'), 500);
            },
        };

        // ランキングデータ
        // === プレイヤー管理 ===
        let currentPlayer = null; // null=ゲスト / {id, name}
        let players = [];         // 登録プレイヤー一覧
        let selectedPlayerId = null; // 選択画面での一時選択

        function loadPlayers() {
            const saved = localStorage.getItem('macaronPlayers');
            players = saved ? JSON.parse(saved) : [];
        }

        function savePlayers() {
            localStorage.setItem('macaronPlayers', JSON.stringify(players));
        }

        function addPlayer(name) {
            name = name.trim();
            if (!name) return null;
            const player = { id: Date.now().toString(), name, bestScores: [] };
            players.push(player);
            savePlayers();
            return player;
        }

        function deletePlayer(id) {
            players = players.filter(p => p.id !== id);
            if (selectedPlayerId === id) selectedPlayerId = null;
            savePlayers();
            renderPlayerList();
        }

        function renderPlayerList() {
            const ul = document.getElementById('playerList');
            ul.innerHTML = '';
            if (players.length === 0) {
                const li = document.createElement('li');
                li.textContent = '登録済みプレイヤーはいません';
                li.style.cursor = 'default';
                li.style.color = '#aaa';
                li.style.fontWeight = 'normal';
                ul.appendChild(li);
                return;
            }
            players.forEach(p => {
                const li = document.createElement('li');
                if (p.id === selectedPlayerId) li.classList.add('selected');
                const best = p.bestScores.length > 0 ? '最高 ' + p.bestScores[0] + '個' : '未プレイ';
                const nameSpan = document.createElement('span');
                nameSpan.textContent = p.name + '　' + best;
                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.className = 'del-btn';
                delBtn.title = '削除';
                delBtn.addEventListener('click', e => { e.stopPropagation(); deletePlayer(p.id); });
                li.appendChild(nameSpan);
                li.appendChild(delBtn);
                li.addEventListener('click', () => {
                    selectedPlayerId = p.id;
                    renderPlayerList();
                });
                ul.appendChild(li);
            });
        }

        // === ランキング機能（プレイヤー対応版） ===
        function saveScore(newScore) {
            if (newScore <= 0) return false;
            let isNewRecord = false;
            if (currentPlayer) {
                // 登録プレイヤー：自分のスコア配列に追加
                const p = players.find(p => p.id === currentPlayer.id);
                if (p) {
                    if (p.bestScores.length === 0 || newScore > p.bestScores[0]) isNewRecord = true;
                    p.bestScores.push(newScore);
                    p.bestScores.sort((a, b) => b - a);
                    p.bestScores = p.bestScores.slice(0, 5);
                    savePlayers();
                }
            }
            updateRankingUI();
            return isNewRecord;
        }

        function updateRankingUI() {
            rankingListEl.innerHTML = '';
            // 全登録プレイヤーのベストスコアを集めてTop5表示
            const entries = [];
            players.forEach(p => {
                if (p.bestScores.length > 0) entries.push({ name: p.name, score: p.bestScores[0] });
            });
            entries.sort((a, b) => b.score - a.score);
            const top5 = entries.slice(0, 5);
            if (top5.length === 0) {
                const li = document.createElement('li');
                li.textContent = '---';
                rankingListEl.appendChild(li);
            } else {
                top5.forEach(e => {
                    const li = document.createElement('li');
                    li.textContent = e.name + ': ' + e.score + '個';
                    rankingListEl.appendChild(li);
                });
            }
        }

        function loadRankings() {
            loadPlayers();
            updateRankingUI();
        }

        // === 初期化処理 ===
        function initGame() {
            isGameOver = false;
            hasStartedStacking = false;
            score = 0;
            timeLeft = 60;
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            blocks = [];
            fairySprites = [];
            fairyTime = 0;

            // プレイヤー名をゲーム中に表示
            const playerBoard = document.getElementById('playerBoard');
            playerBoard.textContent = currentPlayer ? '👤 ' + currentPlayer.name : '';

            // UIリセット
            newRecordText.style.display = 'none';
            stopConfetti();

            loadRankings();
            initPhysics();
            init3D();
            
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', handleMouseMove, false);

            startLoop();
            startGameLogic();
        }

        function initPhysics() {
            world = new CANNON.World();
            world.broadphase = new CANNON.NaiveBroadphase();
            world.gravity.set(0, BASE_GRAVITY_Y, 0); 
            world.solver.iterations = 20;

            const defaultMaterial = new CANNON.Material("default");
            const contactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
                friction: 0.8, // 少し高めの摩擦で滑りにくく
                restitution: 0.2, // 少し跳ね返るように
            });
            world.addContactMaterial(contactMaterial);

            // 可愛いお皿（プラットフォーム）の作成：大きくて薄い円柱
            const platformShape = new CANNON.Cylinder(4, 4, 0.3, 32); 
            // Cannon.jsのCylinderはZ軸に沿うため、Y軸に沿うように回転させる
            const shapeQuat = new CANNON.Quaternion();
            shapeQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);

            platformBody = new CANNON.Body({ 
                mass: 0, 
                type: CANNON.Body.KINEMATIC,
                material: defaultMaterial 
            }); 
            // 形状と同時にオフセット・回転を適用
            platformBody.addShape(platformShape, new CANNON.Vec3(0, 0, 0), shapeQuat);
            platformBody.position.set(0, -2, 0);
            world.addBody(platformBody);
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = null;
            scene.fog = new THREE.Fog(0xF8BBD0, 22, 60);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 15, 25);
            camera.lookAt(0, 3, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true; 
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔らかい高品質な影
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // ライティングの強化
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048; // 影の解像度アップ
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.camera.left = -15;
            dirLight.shadow.camera.right = 15;
            dirLight.shadow.camera.top = 15;
            dirLight.shadow.camera.bottom = -15;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // 補助光（反射による立体感アップ）
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            // リアルな陶器のお皿（グループ）の作成
            platformMesh = new THREE.Group();
            
            // お皿の材質（ツヤツヤの白い陶器）
            const plateMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xfdfdfd,
                metalness: 0.1,
                roughness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });

            // お皿の底面
            const baseGeo = new THREE.CylinderGeometry(3.8, 4, 0.2, 64);
            const baseMesh = new THREE.Mesh(baseGeo, plateMat);
            baseMesh.receiveShadow = true;
            baseMesh.castShadow = true;
            platformMesh.add(baseMesh);

            // お皿のフチ（盛り上がり）
            const rimGeo = new THREE.TorusGeometry(3.8, 0.15, 16, 64);
            const rimMesh = new THREE.Mesh(rimGeo, plateMat);
            rimMesh.rotation.x = Math.PI / 2;
            rimMesh.position.y = 0.1;
            rimMesh.receiveShadow = true;
            rimMesh.castShadow = true;
            platformMesh.add(rimMesh);

            scene.add(platformMesh);

            platformMesh.position.copy(platformBody.position);

            createCastle();
            createFairies();
        }

        function createFairies() {
            const uris = [FAIRY_LEFT_URI, FAIRY_RIGHT_URI];
            const xs   = [-5.0, 5.0];
            const phases = [0, Math.PI];
            uris.forEach((uri, i) => {
                const mat = new THREE.SpriteMaterial({ color: 0xffd6f0, fog: false, transparent: true, alphaTest: 0.01, depthWrite: false });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(6.3, 6.3, 1);
                sprite.position.set(xs[i], 4.5, 6);
                sprite.userData.baseY = 4.5;
                sprite.userData.baseX = xs[i];
                sprite.userData.phase = phases[i];
                scene.add(sprite);
                fairySprites.push(sprite);

                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    const tex = new THREE.CanvasTexture(canvas);
                    tex.minFilter = THREE.LinearFilter;
                    tex.premultiplyAlpha = false;
                    sprite.material.map = tex;
                    sprite.material.color.set(0xffffff);
                    sprite.material.needsUpdate = true;
                };
                img.src = uri;
            });
        }

        function createCastle() {
            const castle = new THREE.Group();

            // ケーキカラーパレット
            const layerColors = [0xFFB6C1, 0xFFF4A3, 0xB5EAD7, 0xFFDAB9, 0xC9B1FF];
            const towerColors = [0xFFB6C1, 0xB5EAD7, 0xC9B1FF, 0xFFF4A3];
            const candyColors = [0xFF6B6B, 0xFFE66D, 0x6BCB77, 0x4D96FF, 0xFF69B4, 0xC77DFF];
            const coneColors  = [0xFF69B4, 0xDA70D6, 0xFF1493, 0xFF69B4];

            function mat(color, rough = 0.55) {
                return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.0 });
            }
            const creamMat = new THREE.MeshPhysicalMaterial({
                color: 0xFFFAF0, roughness: 0.15, metalness: 0.0, clearcoat: 0.9
            });

            // ── 城壁：カラーケーキ層を重ねる ──
            const LH = 1.4; // 1層の高さ
            layerColors.forEach((color, i) => {
                const geo = new THREE.BoxGeometry(10, LH, 3);
                const m = new THREE.Mesh(geo, mat(color));
                m.position.y = i * LH + LH / 2;
                m.castShadow = true; m.receiveShadow = true;
                castle.add(m);
            });
            const wallTop = layerColors.length * LH; // = 7.0

            // 層間クリーム
            for (let i = 1; i < layerColors.length; i++) {
                const geo = new THREE.BoxGeometry(10.35, 0.28, 3.35);
                const m = new THREE.Mesh(geo, creamMat);
                m.position.y = i * LH;
                castle.add(m);
            }

            // 城壁上クリーム
            const ctGeo = new THREE.BoxGeometry(10.5, 0.35, 3.5);
            const ct = new THREE.Mesh(ctGeo, creamMat);
            ct.position.y = wallTop;
            castle.add(ct);

            // 城壁前面クリームだれ（先端に丸玉付き）
            for (let x = -4.2; x <= 4.2; x += 1.05) {
                const dLen = 0.5 + Math.random() * 1.0;
                const dGeo = new THREE.CylinderGeometry(0.13, 0.08, dLen, 8);
                const d = new THREE.Mesh(dGeo, creamMat);
                d.position.set(x, wallTop - dLen / 2 - 0.05, 1.52);
                castle.add(d);
                const bGeo = new THREE.SphereGeometry(0.13, 8, 8);
                const b = new THREE.Mesh(bGeo, creamMat);
                b.position.set(x, wallTop - dLen - 0.13, 1.52);
                castle.add(b);
            }

            // 胸壁：カラフルなブロック
            for (let x = -4.5; x <= 4.5; x += 1.5) {
                const c = layerColors[Math.floor(Math.random() * layerColors.length)];
                const geo = new THREE.BoxGeometry(0.85, 1.05, 0.85);
                const bm = new THREE.Mesh(geo, mat(c));
                bm.position.set(x, wallTop + 0.62, 1.5);
                castle.add(bm);
                // 胸壁上の丸キャンディ
                const cGeo = new THREE.SphereGeometry(0.22, 10, 10);
                const candy = new THREE.Mesh(cGeo, mat(candyColors[Math.floor(Math.random() * candyColors.length)], 0.3));
                candy.position.set(x, wallTop + 1.3, 1.5);
                castle.add(candy);
            }

            // 壁面キャンディボール装飾
            for (let x = -3.5; x <= 3.5; x += 1.8) {
                [LH * 1.5, LH * 3.0, LH * 4.5].forEach(y => {
                    const cGeo = new THREE.SphereGeometry(0.28, 12, 12);
                    const c = new THREE.Mesh(cGeo, mat(candyColors[Math.floor(Math.random() * candyColors.length)], 0.3));
                    c.position.set(x, y, 1.56);
                    castle.add(c);
                });
            }

            // ── 4本のケーキ塔 ──
            [[-5.5, 1.8], [5.5, 1.8], [-5.5, -1.8], [5.5, -1.8]].forEach(([tx, tz], idx) => {
                const tBase = mat(towerColors[idx]);
                const tAlt  = mat(layerColors[(idx + 2) % layerColors.length]);

                // 塔：3層ケーキ
                for (let i = 0; i < 3; i++) {
                    const geo = new THREE.CylinderGeometry(1.28, 1.38, 3.4, 22);
                    const m = new THREE.Mesh(geo, i % 2 === 0 ? tBase : tAlt);
                    m.position.set(tx, 1.7 + i * 3.4, tz);
                    m.castShadow = true;
                    castle.add(m);
                    // 層間クリームリング
                    if (i < 2) {
                        const rGeo = new THREE.TorusGeometry(1.38, 0.14, 8, 28);
                        const r = new THREE.Mesh(rGeo, creamMat);
                        r.position.set(tx, 1.7 + (i + 1) * 3.4, tz);
                        r.rotation.x = Math.PI / 2;
                        castle.add(r);
                    }
                }
                const tTop = 1.7 + 3 * 3.4; // 塔の頂上 y

                // 塔頂クリームリング
                const trGeo = new THREE.TorusGeometry(1.38, 0.2, 8, 28);
                const tr = new THREE.Mesh(trGeo, creamMat);
                tr.position.set(tx, tTop, tz);
                tr.rotation.x = Math.PI / 2;
                castle.add(tr);

                // 塔頂クリームだれ（丸玉付き）
                for (let d = 0; d < 7; d++) {
                    const a = (d / 7) * Math.PI * 2;
                    const dLen = 0.55 + Math.random() * 0.9;
                    const dGeo = new THREE.CylinderGeometry(0.11, 0.07, dLen, 7);
                    const drip = new THREE.Mesh(dGeo, creamMat);
                    drip.position.set(tx + Math.cos(a) * 1.2, tTop - dLen / 2 - 0.1, tz + Math.sin(a) * 1.2);
                    castle.add(drip);
                    const bGeo = new THREE.SphereGeometry(0.11, 7, 7);
                    const ball = new THREE.Mesh(bGeo, creamMat);
                    ball.position.set(tx + Math.cos(a) * 1.2, tTop - dLen - 0.2, tz + Math.sin(a) * 1.2);
                    castle.add(ball);
                }

                // 円錐尖塔（カラフル）
                const coneGeo = new THREE.ConeGeometry(1.5, 3.8, 22);
                const cone = new THREE.Mesh(coneGeo, mat(coneColors[idx], 0.4));
                cone.position.set(tx, tTop + 1.9, tz);
                cone.castShadow = true;
                castle.add(cone);

                // キャンディボール（塔頂リング上）
                for (let b = 0; b < 7; b++) {
                    const a = (b / 7) * Math.PI * 2;
                    const cGeo = new THREE.SphereGeometry(0.24, 10, 10);
                    const c = new THREE.Mesh(cGeo, mat(candyColors[b % candyColors.length], 0.3));
                    c.position.set(tx + Math.cos(a) * 1.4, tTop + 0.3, tz + Math.sin(a) * 1.4);
                    castle.add(c);
                }
            });

            // ── 正門：ピンクのキャンディアーチ ──
            const gGeo = new THREE.BoxGeometry(2.6, 4.2, 0.5);
            const gate = new THREE.Mesh(gGeo, mat(0xFFDAB9));
            gate.position.set(0, 2.1, 1.56);
            castle.add(gate);

            const aGeo = new THREE.TorusGeometry(1.3, 0.3, 10, 22, Math.PI);
            const arch = new THREE.Mesh(aGeo, mat(0xFF69B4, 0.35));
            arch.position.set(0, 4.2, 1.62);
            arch.rotation.z = Math.PI;
            castle.add(arch);

            // アーチ上のキャンディボール
            for (let i = 0; i <= 5; i++) {
                const a = (i / 5) * Math.PI - Math.PI / 2;
                const cGeo = new THREE.SphereGeometry(0.2, 10, 10);
                const c = new THREE.Mesh(cGeo, mat(candyColors[i % candyColors.length], 0.3));
                c.position.set(Math.cos(a) * 1.3, 4.2 + Math.sin(a) * 1.3, 1.72);
                castle.add(c);
            }

            // ── 旗ポール＋旗 ──
            const pGeo = new THREE.CylinderGeometry(0.07, 0.07, 4.0, 8);
            const pole = new THREE.Mesh(pGeo, mat(0xFFCC00, 0.3));
            pole.position.set(0, wallTop + 2.6, 0);
            castle.add(pole);

            const fGeo = new THREE.PlaneGeometry(2.0, 1.1);
            const flag = new THREE.Mesh(fGeo, new THREE.MeshStandardMaterial({ color: 0xFF1493, side: THREE.DoubleSide }));
            flag.position.set(1.0, wallTop + 3.75, 0);
            castle.add(flag);

            castle.position.set(0, -2, -15);
            castle.scale.set(0.85, 0.85, 0.85);
            scene.add(castle);
        }

        // === ゲームロジック ===
        function spawnBlock() {
            if (isGameOver) return;

            // マカロンのサイズ
            const radius = 0.7 + Math.random() * 0.2; 
            const height = 0.4 + Math.random() * 0.1;

            // --- 物理ボディの作成 ---
            const shape = new CANNON.Cylinder(radius, radius, height, 16);
            // Cannon.jsのCylinderはZ軸に沿うため、Y軸に沿うように回転させる
            const shapeQuat = new CANNON.Quaternion();
            shapeQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);

            const body = new CANNON.Body({ mass: radius * 2 });
            body.addShape(shape, new CANNON.Vec3(0, 0, 0), shapeQuat);
            
            // 最初からお皿の上に落ちるよう、中心付近から落とす
            const spawnX = (Math.random() - 0.5) * 3;
            const spawnZ = (Math.random() - 0.5) * 3;
            body.position.set(spawnX, 22, spawnZ);
            
            // 少し回転させておく
            const axis = new CANNON.Vec3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
            axis.normalize(); 
            body.quaternion.setFromAxisAngle(axis, Math.random() * Math.PI);
            
            // 初回の衝突時のみ音を鳴らすためのフラグ
            body.hasCollided = false;
            body.addEventListener("collide", function(e) {
                // 初回の衝突で、かつ一定以上の勢いでぶつかった時のみ音を鳴らす
                if(!body.hasCollided && e.contact.getImpactVelocityAlongNormal() > 0.5) {
                    SoundSystem.playCollision();
                    body.hasCollided = true;
                }
            });
            world.addBody(body);
            SoundSystem.playSpawn(); // マカロン出現音

            // --- 3Dメッシュの作成（リアルなマカロン） ---
            const pastelColors = [
                0xFF6B81, 0xFFA502, 0xFFD32A, 0x2ED573, 0x1E90FF, 0x9C88FF, 0xFF5285
            ];
            const randomColor = pastelColors[Math.floor(Math.random() * pastelColors.length)];
            
            // マカロン生地（シェル）の材質: マットでサクッとした質感
            const shellMat = new THREE.MeshStandardMaterial({ 
                color: randomColor, 
                roughness: 0.8, 
                metalness: 0.05 
            });

            // クリームの材質: 少しツヤのあるクリーム色
            const creamMat = new THREE.MeshStandardMaterial({
                color: 0xfffdd0,
                roughness: 0.3,
                metalness: 0.0
            });

            const mesh = new THREE.Group();

            // 上のシェル（半球をY軸で潰す）
            const topShellGeo = new THREE.SphereGeometry(radius, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const topShell = new THREE.Mesh(topShellGeo, shellMat);
            topShell.scale.set(1, 0.4, 1);
            topShell.position.y = height * 0.2;
            topShell.castShadow = true;
            topShell.receiveShadow = true;
            mesh.add(topShell);

            // 下のシェル
            const bottomShellGeo = new THREE.SphereGeometry(radius, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const bottomShell = new THREE.Mesh(bottomShellGeo, shellMat);
            bottomShell.scale.set(1, 0.4, 1);
            bottomShell.rotation.x = Math.PI; // 下向きにする
            bottomShell.position.y = -height * 0.2;
            bottomShell.castShadow = true;
            bottomShell.receiveShadow = true;
            mesh.add(bottomShell);

            // 中のクリーム（一回り小さい円柱）
            const creamGeo = new THREE.CylinderGeometry(radius * 0.85, radius * 0.85, height * 0.4, 32);
            const cream = new THREE.Mesh(creamGeo, creamMat);
            cream.castShadow = true;
            cream.receiveShadow = true;
            mesh.add(cream);

            scene.add(mesh);
            blocks.push({ body: body, mesh: mesh, settledFrames: 0 });
        }

        function spawnCandyDrop() {
            if (isGameOver) return;

            const r = 0.45 + Math.random() * 0.1;

            // 物理ボディ：X軸方向の円柱（一方向に転がりやすい）
            const shape = new CANNON.Cylinder(r * 0.78, r * 0.78, r * 2.2, 14);
            const shapeQuat = new CANNON.Quaternion();
            shapeQuat.setFromAxisAngle(new CANNON.Vec3(0, 0, 1), Math.PI / 2);
            const body = new CANNON.Body({ mass: r * 1.5, linearDamping: 0.1, angularDamping: 0.05 });
            body.addShape(shape, new CANNON.Vec3(0, 0, 0), shapeQuat);
            body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.random() * Math.PI * 2);
            body.position.set((Math.random() - 0.5) * 2.5, 22, (Math.random() - 0.5) * 2.5);
            body.hasCollided = false;
            body.addEventListener('collide', function(e) {
                if (!body.hasCollided && e.contact.getImpactVelocityAlongNormal() > 0.5) {
                    SoundSystem.playCandyDrop();
                    body.hasCollided = true;
                }
            });
            world.addBody(body);

            // マテリアル
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xFFCC00,
                emissive: 0x996600,
                emissiveIntensity: 0.30,
                roughness: 0.25,
                metalness: 0.50
            });
            const goldDarkMat = new THREE.MeshStandardMaterial({
                color: 0xD49000,
                emissive: 0x6B4400,
                emissiveIntensity: 0.20,
                roughness: 0.40,
                metalness: 0.45
            });

            // LatheGeometry でなめらかな包み紙シルエットを生成
            // プロファイル点列（x=半径, y=軸方向）：下先端→中央→上先端
            const pts = [
                new THREE.Vector2(0.02 * r, -1.80 * r),
                new THREE.Vector2(0.09 * r, -1.58 * r),
                new THREE.Vector2(0.21 * r, -1.35 * r), // ひれ張り出し
                new THREE.Vector2(0.25 * r, -1.14 * r), // ひれ最大
                new THREE.Vector2(0.12 * r, -0.97 * r), // くびれ
                new THREE.Vector2(0.07 * r, -0.84 * r), // 首
                new THREE.Vector2(0.26 * r, -0.64 * r), // 肩
                new THREE.Vector2(0.43 * r, -0.38 * r),
                new THREE.Vector2(0.49 * r, -0.14 * r),
                new THREE.Vector2(0.50 * r,  0.00),      // 赤道
                new THREE.Vector2(0.49 * r,  0.14 * r),
                new THREE.Vector2(0.43 * r,  0.38 * r),
                new THREE.Vector2(0.26 * r,  0.64 * r),
                new THREE.Vector2(0.07 * r,  0.84 * r),
                new THREE.Vector2(0.12 * r,  0.97 * r),
                new THREE.Vector2(0.25 * r,  1.14 * r),
                new THREE.Vector2(0.21 * r,  1.35 * r),
                new THREE.Vector2(0.09 * r,  1.58 * r),
                new THREE.Vector2(0.02 * r,  1.80 * r),
            ];

            const mesh = new THREE.Group();

            // メイン形状（Y軸まわりに回転体生成 → Z軸で90°倒してX方向に）
            const candyGeo = new THREE.LatheGeometry(pts, 32);
            const candy = new THREE.Mesh(candyGeo, goldMat);
            candy.rotation.z = Math.PI / 2;
            candy.castShadow = true;
            candy.receiveShadow = true;
            mesh.add(candy);

            // ねじり部のクリース（暗い輪で折り目感を表現）
            [[-0.92 * r, 0.09 * r], [-0.84 * r, 0.07 * r],
             [ 0.84 * r, 0.07 * r], [ 0.92 * r, 0.09 * r]].forEach(([xPos, tR]) => {
                const creaseGeo = new THREE.TorusGeometry(tR, tR * 0.28, 6, 20);
                const crease = new THREE.Mesh(creaseGeo, goldDarkMat);
                crease.position.x = xPos;
                crease.rotation.y = Math.PI / 2;
                mesh.add(crease);
            });

            // ハイライト
            const hlGeo = new THREE.SphereGeometry(r * 0.16, 8, 8);
            const hlMat = new THREE.MeshBasicMaterial({ color: 0xfffff8, transparent: true, opacity: 0.85 });
            const hl = new THREE.Mesh(hlGeo, hlMat);
            hl.position.set(r * 0.20, r * 0.28, r * 0.40);
            mesh.add(hl);

            scene.add(mesh);
            blocks.push({ body, mesh, settledFrames: 0 });
        }

        function scheduleCandyDrop() {
            const delay = Math.random() * 8000 + 7000; // 7〜15秒にランダムで1個
            setTimeout(() => {
                if (!isGameOver) spawnCandyDrop();
                scheduleCandyDrop();
            }, delay);
        }

        function startGameLogic() {
            prevConfirmedSettled = 0;
            awawawCooldown = 0;
            recentFallCount = 0;
            recentFallTimer = 0;
            triggeredMilestones = new Set();
            FairyVoice.onStart();
            SoundSystem.playBGM();
            spawnBlock(); // 最初の1個
            dropIntervalId = setInterval(spawnBlock, 2000); // 2秒ごとに降ってくる
            scheduleCandyDrop(); // キャンディドロップ開始
            
            // 1秒ごとにタイマーを減らす
            timerIntervalId = setInterval(() => {
                if (isGameOver) return;
                timeLeft--;
                timerEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    triggerGameClear();
                }
            }, 1000);
        }

        // === メインループ（毎フレーム実行） ===
        function startLoop() {
            function animate() {
                if (isGameOver) return;
                animationFrameId = requestAnimationFrame(animate);

                // 台の傾きを更新
                const targetEuler = new THREE.Euler(targetTiltX, 0, targetTiltZ, 'XYZ');
                const targetQuat = new THREE.Quaternion().setFromEuler(targetEuler);
                platformMesh.quaternion.slerp(targetQuat, 0.1);
                
                platformBody.quaternion.set(
                    platformMesh.quaternion.x,
                    platformMesh.quaternion.y,
                    platformMesh.quaternion.z,
                    platformMesh.quaternion.w
                );

                world.step(1 / 60);

                // ブロックの落下・削除処理
                for (let i = blocks.length - 1; i >= 0; i--) {
                    const b = blocks[i];
                    b.mesh.position.copy(b.body.position);
                    b.mesh.quaternion.copy(b.body.quaternion);

                    // 落下判定（画面外の下に落ちたら）
                    if (b.body.position.y < -40) {
                        world.removeBody(b.body);
                        scene.remove(b.mesh);
                        blocks.splice(i, 1);
                        // あわわ！用：落下カウント
                        recentFallCount++;
                        recentFallTimer = 60; // 1秒ウィンドウをリセット
                    }
                }

                // スコア（現在台の上にあるブロックの数）を更新
                score = blocks.length;
                scoreEl.textContent = score;

                // ① すごい！ — マイルストーン達成（2秒以上安定）
                const MILESTONES = [
                    { count:  5, text: 'すごい！',       fires: 1 },
                    { count: 10, text: 'すごい！',       fires: 2 },
                    { count: 15, text: 'すごい！',       fires: 3 },
                    { count: 20, text: 'すごい！',       fires: 3 },
                    { count: 25, text: 'めっちゃすごい！', fires: 1 },
                ];
                let confirmedSettled = 0;
                for (const b of blocks) {
                    const v = b.body.velocity;
                    const speed = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
                    if (speed < 0.5 && b.body.position.y > -3) {
                        b.settledFrames++;
                    } else {
                        b.settledFrames = 0;
                    }
                    if (b.settledFrames >= 120) confirmedSettled++; // 約2秒
                }
                for (const m of MILESTONES) {
                    if (confirmedSettled >= m.count && !triggeredMilestones.has(m.count)) {
                        triggeredMilestones.add(m.count);
                        FairyVoice.onStacked(m.text, m.fires);
                    }
                }
                prevConfirmedSettled = confirmedSettled;

                // ② あわわ！ — 1秒以内に2個以上皿から落ちた
                if (recentFallTimer > 0) {
                    recentFallTimer--;
                } else {
                    recentFallCount = 0;
                }
                if (recentFallCount >= 2 && awawawCooldown === 0) {
                    FairyVoice.onDanger();
                    awawawCooldown = 180;
                    recentFallCount = 0;
                }
                if (awawawCooldown > 0) awawawCooldown--;

                // 1個以上積まれたか（scoreが1以上になったら）フラグを立てる
                if (score > 0) {
                    hasStartedStacking = true;
                }

                // 1度以上積まれた後で、スコアが0（全て落ちた）になったらゲームオーバー
                if (hasStartedStacking && score === 0) {
                    triggerGameOver();
                }

                fairyTime += 0.018;
                fairySprites.forEach(s => {
                    s.position.y = s.userData.baseY + Math.sin(fairyTime + s.userData.phase) * 0.22;
                    s.position.x = s.userData.baseX + Math.sin(fairyTime * 0.55 + s.userData.phase) * 0.12;
                });
                renderer.render(scene, camera);
            }
            animate();
        }

        function triggerGameOver() {
            console.log('[GAMEOVER] triggerGameOver called');
            isGameOver = true;
            FairyVoice.reset();
            clearInterval(dropIntervalId);
            clearInterval(timerIntervalId);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            SoundSystem.stopBGM();
            SoundSystem.playGameOver();
            FairyVoice.onGameEnd();
            
            const isNewRecord = saveScore(score);
            finalScoreOverEl.textContent = score;
            gameOverScreen.style.display = 'block';
            
            if (isNewRecord) {
                // ゲームオーバー時でも、もし新記録なら花吹雪
                startConfetti();
            }
        }

        function triggerGameClear() {
            console.log('[GAMECLEAR] triggerGameClear called');
            isGameOver = true;
            FairyVoice.reset();
            clearInterval(dropIntervalId);
            clearInterval(timerIntervalId);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            SoundSystem.stopBGM();
            SoundSystem.playClear();
            FairyVoice.onGameEnd();

            const isNewRecord = saveScore(score);
            finalScoreClearEl.textContent = score;
            gameClearScreen.style.display = 'block';

            if (isNewRecord) {
                newRecordText.style.display = 'block';
                startConfetti();
            }
        }

        function cleanupGame() {
            clearInterval(dropIntervalId);
            clearInterval(timerIntervalId);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (scene) {
                while(scene.children.length > 0){ 
                    const object = scene.children[0];
                    scene.remove(object);
                }
            }
            if (world) {
                world = null;
            }
            if (renderer && renderer.domElement) {
                container.innerHTML = '';
            }
            window.removeEventListener('mousemove', handleMouseMove);
        }

        function resetGame() {
            cleanupGame();
            gameOverScreen.style.display = 'none';
            gameClearScreen.style.display = 'none';
            retryBtnAfterFinish.style.display = 'none';
            initGame();
        }

        // === 操作入力イベント ===
        function handleMouseMove(event) {
            if (isGameOver) return;
            const normalizedX = (event.clientX / window.innerWidth) * 2 - 1;
            const normalizedY = (event.clientY / window.innerHeight) * 2 - 1;
            targetTiltZ = -normalizedX * MAX_TILT_ANGLE;
            targetTiltX = normalizedY * MAX_TILT_ANGLE;
        }

        function handleOrientation(event) {
            if (isGameOver) return;
            let beta = event.beta;   
            let gamma = event.gamma; 
            if (beta === null || gamma === null) return;

            // 画面の向きを取得
            let orientation = window.orientation || (screen.orientation || {}).angle || 0;
            let tiltX = 0;
            let tiltZ = 0;

            // 画面の向きに合わせてセンサーの軸を入れ替える
            if (orientation === 90) {
                tiltX = gamma;
                tiltZ = beta;
            } else if (orientation === -90 || orientation === 270) {
                tiltX = -gamma;
                tiltZ = -beta;
            } else if (orientation === 180) {
                tiltX = -beta;
                tiltZ = gamma;
            } else { // 0度（通常の縦持ち）
                tiltX = beta;
                tiltZ = -gamma;
            }

            // 傾きの最大値を制限 (45度)
            if (tiltX > 45) tiltX = 45;
            if (tiltX < -45) tiltX = -45;
            if (tiltZ > 45) tiltZ = 45;
            if (tiltZ < -45) tiltZ = -45;

            targetTiltX = (tiltX / 45) * MAX_TILT_ANGLE;
            targetTiltZ = (tiltZ / 45) * MAX_TILT_ANGLE;
        }

        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            initGame();
                        } else {
                            alert("ゲームを遊ぶには傾きセンサーの許可が必要です。");
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                initGame();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            sugarCanvas.width = window.innerWidth;
            sugarCanvas.height = window.innerHeight;
        }

        // === 粉砂糖パーティクルシステム ===
        const sugarCanvas = document.getElementById('sugarCanvas');
        const sugarCtx = sugarCanvas.getContext('2d');
        let sugarParticles = [];

        function initSugar() {
            sugarCanvas.width = window.innerWidth;
            sugarCanvas.height = window.innerHeight;
            sugarParticles = [];
            for (let i = 0; i < 3000; i++) {
                sugarParticles.push(createSugarParticle(true));
            }
            renderSugar();
            scheduleSugarBurst();
        }

        function createSugarParticle(randomY, burst) {
            return {
                x: Math.random() * sugarCanvas.width,
                y: randomY ? Math.random() * sugarCanvas.height : -3,
                r: Math.random() * 2.7 + 0.9,
                dx: (Math.random() - 0.5) * 0.3,
                dy: burst ? Math.random() * 6 + 3 : Math.random() * 0.4 + 0.15,
                opacity: Math.random() * 0.5 + 0.3,
                wave: Math.random() * Math.PI * 2,
                waveSpeed: Math.random() * 0.015 + 0.005,
                burst: burst || false
            };
        }

        function scheduleSugarBurst() {
            const delay = Math.random() * 6000 + 4000; // 4〜10秒ごと
            setTimeout(() => {
                for (let i = 0; i < 2000; i++) {
                    sugarParticles.push(createSugarParticle(false, true));
                }
                scheduleSugarBurst();
            }, delay);
        }

        function renderSugar() {
            requestAnimationFrame(renderSugar);
            sugarCtx.clearRect(0, 0, sugarCanvas.width, sugarCanvas.height);
            sugarCtx.shadowBlur = 0;
            for (let i = sugarParticles.length - 1; i >= 0; i--) {
                const p = sugarParticles[i];
                p.wave += p.waveSpeed;
                p.y += p.dy;
                p.x += p.dx + Math.sin(p.wave) * 0.2;

                sugarCtx.beginPath();
                sugarCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sugarCtx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                sugarCtx.fill();

                if (p.y > sugarCanvas.height + 3) {
                    if (p.burst) {
                        sugarParticles.splice(i, 1); // バースト粒は消す
                    } else {
                        sugarParticles[i] = createSugarParticle(false, false);
                    }
                }
            }
        }

        // 初期表示時にランキングを読み込んでおく
        loadRankings();
        // キャンバスサイズ初期化
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        initSugar();

        // === オーディオアンロック共通処理 ===
        function unlockAudio() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!FairyVoice._ready) FairyVoice.init(audioCtx);
        }

        // === ゲーム開始共通処理 ===
        function startGame() {
            unlockAudio();
            const playerScreen = document.getElementById('playerScreen');
            startScreen.style.display = 'none';
            playerScreen.style.display = 'none';
            requestOrientationPermission();
        }

        // スタート画面：ゲストでプレイ
        startBtn.addEventListener('click', () => {
            SoundSystem.playClick();
            currentPlayer = null;
            startGame();
        });

        // スタート画面：プレイヤー選択へ
        document.getElementById('playerSelectBtn').addEventListener('click', () => {
            SoundSystem.playClick();
            selectedPlayerId = currentPlayer ? currentPlayer.id : null;
            renderPlayerList();
            startScreen.style.display = 'none';
            document.getElementById('playerScreen').style.display = 'block';
        });

        // プレイヤー選択画面：新規登録
        document.getElementById('addPlayerBtn').addEventListener('click', () => {
            const input = document.getElementById('newPlayerInput');
            const name = input.value.trim();
            if (!name) return;
            const p = addPlayer(name);
            if (p) {
                selectedPlayerId = p.id;
                input.value = '';
                renderPlayerList();
            }
        });
        document.getElementById('newPlayerInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('addPlayerBtn').click();
        });

        // プレイヤー選択画面：ゲストでプレイ
        document.getElementById('guestFromPlayerBtn').addEventListener('click', () => {
            SoundSystem.playClick();
            currentPlayer = null;
            startGame();
        });

        // プレイヤー選択画面：このプレイヤーで開始
        document.getElementById('startWithPlayerBtn').addEventListener('click', () => {
            SoundSystem.playClick();
            if (selectedPlayerId) {
                currentPlayer = players.find(p => p.id === selectedPlayerId) || null;
            } else {
                currentPlayer = null;
            }
            startGame();
        });

        retryBtnOver.addEventListener('click', () => {
            SoundSystem.playClick();
            resetGame();
        });
        retryBtnClear.addEventListener('click', () => {
            SoundSystem.playClick();
            resetGame();
        });
        finishBtnClear.addEventListener('click', () => {
            SoundSystem.playClick();
            gameClearScreen.style.display = 'none';
            retryBtnAfterFinish.style.display = 'block';
        });
        retryBtnAfterFinish.addEventListener('click', () => {
            SoundSystem.playClick();
            resetGame();
        });

        // === 花吹雪（Confetti）演出システム ===
        let particles = [];
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];

        function startConfetti() {
            particles = [];
            const particleCount = 150;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 4 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            renderConfetti();

            // 10秒後に花吹雪を停止する
            if (confettiTimeoutId) clearTimeout(confettiTimeoutId);
            confettiTimeoutId = setTimeout(stopConfetti, 10000);
        }

        function renderConfetti() {
            confettiFrameId = requestAnimationFrame(renderConfetti);
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + p.dy + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                
                confettiCtx.beginPath();
                confettiCtx.lineWidth = p.r;
                confettiCtx.strokeStyle = p.color;
                confettiCtx.moveTo(p.x + p.tilt + p.r, p.y);
                confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                confettiCtx.stroke();

                // 画面下部に行ったら上部に戻す
                if (p.y > confettiCanvas.height) {
                    p.x = Math.random() * confettiCanvas.width;
                    p.y = -10;
                }
            }
        }

        function stopConfetti() {
            if (confettiFrameId) {
                cancelAnimationFrame(confettiFrameId);
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
            if (confettiTimeoutId) {
                clearTimeout(confettiTimeoutId);
                confettiTimeoutId = null;
            }
        }

    </script>
